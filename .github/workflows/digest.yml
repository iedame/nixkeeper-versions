name: "Digest: Repology's nixpkgs projects"

# Keeps the digest (the data branch: data/projects.jsonl.gz and data/meta.json)
# up to date with Repology, daily before nixkeeper's sync (06:00 UTC): every
# outdated nixpkgs project, the ones no longer outdated, and a seventh of all
# nixpkgs' projects, so each is read weekly (nixkeeper_versions/cli.py). About
# 200 requests to Repology's API, one a second; Typst Universe's index, one
# request (data/typst.json.gz); the Emacs archives' indexes, four
# (data/emacs.json.gz); Stackage LTS, two (data/stackage.json.gz); and GitHub
# releases (data/releases.json.gz): weekly, an evaluation of nixpkgs for
# where packages come from (Nix, about a minute), daily a seventh of their
# repositories, 25 a GraphQL query with the workflow's own token (about 130
# points of its 1,000 an hour). The data branch is main plus one commit with the
# digest (scripts/data-branch.sh).

on:
  schedule:
    - cron: '7 4 * * *'   # daily at 04:07 UTC: done well before 06:00
  # Also started through the API at the same time from outside GitHub (its
  # schedule skips runs when busy), with if_older: whichever starts second
  # finds the digest fresh and stops.
  workflow_dispatch:
    inputs:
      full:
        description: "Read all nixpkgs projects (about an hour), not a seventh"
        type: boolean
        default: false
      if_older:
        description: "Only if the last run is older than this many hours (empty: always)"
        type: string
        default: ""

# One run at a time: a run waits for the last instead of cancelling it.
concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write  # publishes the data branch

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the last published digest, on main
        run: bash scripts/data-branch.sh restore

      # Nix: GitHub releases evaluate nixpkgs, with nixkeeper's code (the
      # flake's input).
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Bring the digest up to date
        run: >-
          nix run . -- data
          ${{ inputs.full && '--full' || '' }}
          ${IF_OLDER:+--if-older "$IF_OLDER"}
        env:
          # Scheduled runs too: the outside start may have come first. (An
          # input reaches the shell as a variable, never as code.)
          IF_OLDER: ${{ github.event_name == 'schedule' && '12' || inputs.if_older }}
          # GitHub releases' GraphQL queries: public repositories' tags only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the digest if it changed
        run: |
          bash scripts/data-branch.sh publish "digest: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
